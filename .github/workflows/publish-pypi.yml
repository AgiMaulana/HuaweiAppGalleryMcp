name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -v

  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release branch and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          python <<'PY'
          import os
          import pathlib
          import sys

          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          tag = os.environ["RELEASE_TAG"]
          target = os.environ["RELEASE_TARGET"]

          if not tag.startswith("v"):
              print(f"Release tag must start with 'v', got: {tag}", file=sys.stderr)
              sys.exit(1)

          if not target.startswith("release/"):
              print(
                  "PyPI publish is only allowed from a release branch target. "
                  f"Expected release/*, got: {target}",
                  file=sys.stderr,
              )
              sys.exit(1)

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              print(
                  "Release tag does not match package version in pyproject.toml. "
                  f"Expected {expected_tag}, got {tag}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Validated release target {target} and package version {version}.")
          PY

  build:
    name: Build distribution
    needs: validate-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write  # Required for trusted publishing (OIDC)

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
